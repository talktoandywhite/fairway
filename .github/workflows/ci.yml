name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint & format
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # The design system is enforced, not suggested (DESIGN.md §9). A token
      # edited to a failing contrast ratio or a chart slot that collapses under
      # colorblind simulation fails the build here.
      - name: Contrast
        run: pnpm test:contrast

      - name: Chart palette
        run: pnpm test:palette

      - name: Build
        run: pnpm build
